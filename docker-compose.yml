version: '3.8'

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build: .
    container_name: resume_parser_api
    
    ports:
      - "8000:8000"
    
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      OLLAMA_HOST: http://ollama:11434
    
    depends_on:
      ollama:
        condition: service_started
    
    command: >
      /bin/sh -c "
        # 1. Wait briefly for ollama server to be online
        sleep 10 &&

        # 2. Pull the model using the Python client. 
        # Note: We are using 'host' here, which works with recent ollama-python versions.
        python -c 'from ollama import Client; Client(host=\"http://ollama:11434\").pull(\"mistral\")' &&

        # 3. Start the API
        uvicorn api:app --host 0.0.0.0 --port 8000
      "
    extra_hosts:
      - "ollama:172.17.0.1" 

volumes:
  ollama_data:
